[workspace]
members = ["crates/manual-reviewer-core", "crates/manual-reviewer-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["jel1yspot <shadowblaze_kai@icloud.com>"]
repository = "https://github.com/jel1yspot/manual-reviewer-zed"
homepage = "https://github.com/jel1yspot/manual-reviewer-zed"
rust-version = "1.78"

[workspace.dependencies]
manual-reviewer-core = { path = "crates/manual-reviewer-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["serde", "now", "clock"] }
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
