[package]
name = "manual-reviewer-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "`mreview` — Manual Reviewer CLI. Pairs with the Zed task system to leave structured review comments on selected code regions."

[[bin]]
name = "mreview"
path = "src/main.rs"

[dependencies]
manual-reviewer-core.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
chrono.workspace = true
uuid.workspace = true
clap = { version = "4", features = ["derive", "env"] }
arboard = { version = "3", default-features = false }
reedline = "0.47"

[dev-dependencies]
tempfile = "3"
