name: release

on:
  push:
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace
      - run: cargo test --workspace

  build-release:
    name: build ${{ matrix.target }}
    needs: [test]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install cross compiler (linux aarch64)
        if: matrix.cross
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Configure linker for aarch64-linux
        if: matrix.cross
        run: echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
      - run: cargo build --release --target ${{ matrix.target }} --bin mreview
      - name: Stage artifact
        run: |
          mkdir -p stage
          cp target/${{ matrix.target }}/release/mreview stage/
          cp README.md stage/ || true
          ARCHIVE="mreview-${GITHUB_REF_NAME:-dev}-${{ matrix.target }}.tar.gz"
          (cd stage && tar -czf "../$ARCHIVE" .)
          echo "ARCHIVE=$ARCHIVE" >> $GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: mreview-${{ matrix.target }}
          path: ${{ env.ARCHIVE }}

  release:
    name: attach to GitHub Release
    needs: build-release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Move tarballs to one dir
        run: |
          mkdir -p release
          find dist -name '*.tar.gz' -exec mv {} release/ \;
          ls -la release
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*.tar.gz
          fail_on_unmatched_files: true
